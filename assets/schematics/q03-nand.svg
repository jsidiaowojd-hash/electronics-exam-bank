-serif" stroke="none">T₃</text><path d="M352 210H375"/><text x="317" y="232" fill="#203750" font-size="15" font-family="Arial,sans-serif" stroke="none">T₂</text><path d="M352 228H375"/><path d="M468 227H492"/><rect x="565" y="196" width="83" height="62" rx="4"/><text x="589" y="235" fill="#203750" font-size="26" font-family="Arial,sans-serif" stroke="none">&amp;</text><circle cx="653" cy="227" r="5" fill="white"/><text x="507" y="214" fill="#203750" font-size="15" font-family="Arial,sans-serif" stroke="none">T₃</text><path d="M542 210H565"/><text x="507" y="232" fill="#203750" font-size="15" font-family="Arial,sans-serif" stroke="none">T₁</text><path d="M542 228H565"/><text x="507" y="250" fill="#203750" font-size="15" font-family="Arial,sans-serif" stroke="none">T₀</text><path d="M542 246H565"/><path d="M658 227H682"/><rect x="760" y="90" width="75" height="58"/><rect x="760" y="230" width="75" height="58"/><text x="785" y="125" fill="#203750" font-size="24" font-family="Arial,sans-serif" stroke="none">&amp;</text><text x="785" y="265" fill="#203750" font-size="24" font-family="Arial,sans-serif" stroke="none">&amp;</text><circle cx="841" cy="119" r="5" fill="white"/><circle cx="841" cy="259" r="5" fill="white"/><path d="M492 97H721V105H760M682 97H729V134H760M492 227H720V244H760M682 227H730V273H760M846 119H937M846 259H937"/><text x="949" y="125" fill="#203750" font-size="22" font-family="Arial,sans-serif" stroke="none">X</text><text x="949" y="265" fill="#203750" font-size="22" font-family="Arial,sans-serif" stroke="none">Y</text><text x="366" y="341" fill="#203750" font-size="15" font-family="Arial,sans-serif" stroke="none">每个 &amp; 旁带输出小圆圈，表示 NAND（与非门）。</text><text x="34" y="469" fill="#203750" font-size="16" font-family="Arial,sans-serif" stroke="none">注：按参考答案采用 0～4 暖风、5～10 全关、11～15 冷风的边界约定。</text></g></svg>