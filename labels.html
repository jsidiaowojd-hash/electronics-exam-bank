function render(rows){
  if(!rows.length){ list.innerHTML = '<p class="muted">没有匹配的题目。</p>'; return; }
  list.innerHTML = rows.map(function(q){
    return '<div class="q"><div class="top">第 '+q.no+' 题 · '+q.subject+' · '+q.chapter+'</div>'

      + '<a href="'+q.link+'" target="_blank" rel="noopener">打开原题页面 →</a></div>';
  }).join('');
}
render(DATA.questions);
document.getElementById('q').addEventListener('input', function(){
  const s = this.value.trim().toLowerCase();
  if(!s){ render(DATA.questions); return; }
  render(DATA.questions.filter(function(q){
    const blob = (q.chapter+' '+q.tags.join(' ')+' '+q.subject).toLowerCase();
    return blob.indexOf(s) > -1;
  }));
});
